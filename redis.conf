# Redis configuration for Computer Lab Cache

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (for cache, we don't need much persistence)
save 900 1
save 300 10
save 60 10000

# Cache-specific settings
timeout 300
tcp-keepalive 60

# Logging
loglevel notice
logfile ""

# Database
databases 16

# Cache expiration
# TTL mặc định: 1 tiếng (3600 giây)
# TTL cho calendar data: 1 tiếng
# TTL cho booking data: 1 tiếng  
# TTL cho welcome messages: 1 tiếng 